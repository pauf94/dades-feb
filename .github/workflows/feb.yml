name: Dades FEB setmanals

on:
  schedule:
    - cron: "0 5 * * 1"   # dilluns a les 5:00 UTC (7:00 a l'estiu, 6:00 a l'hivern)
    - cron: "0 9 * * 1"   # dilluns a les 9:00 UTC: segona oportunitat si GitHub s'ha saltat la primera
    - cron: "0 5 * * 3"   # dimecres: partits ajornats del cap de setmana
    - cron: "0 5 * * 4"   # dijous: partits jugats dimecres (jornades entre setmana i ajornats)
  workflow_dispatch:
    inputs:
      mode:
        description: "test = prova amb una jornada coneguda · run = extracció normal"
        default: "test"
        type: choice
        options: [test, run]
      comp:
        description: "Competició (all, lf, challenge, lf2a, lf2b)"
        default: "all"
      season:
        description: "Any d'inici de temporada"
        default: "2026"
      jornada:
        description: "Número de jornada (1, J1...) o 'last'"
        default: "last"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instal·lar dependències
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Extreure dades
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "test" ]; then
            python feb_scraper.py --test --out data-test
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python feb_scraper.py --comp "${{ inputs.comp }}" --season "${{ inputs.season }}" --jornada "${{ inputs.jornada }}"
          else
            python feb_scraper.py --comp all --season 2026 --jornada last
          fi
      - name: Calcular mètriques i full mestre
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "test" ]; then
            python analitza.py --comp lf2a --season 2025 --jornada 26 --data data-test --out .
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python analitza.py --comp "${{ inputs.comp }}" --season "${{ inputs.season }}" --jornada "${{ inputs.jornada }}"
          else
            python analitza.py --comp all --season 2026 --jornada last
          fi

      - name: Desar resultats al repositori
        if: always()
        run: |
          git config user.name "feb-bot"
          git config user.email "feb-bot@users.noreply.github.com"
          for d in data data-test fulls resums proves docs; do
            if [ -d "$d" ]; then git add "$d"; fi
          done
          if git diff --cached --quiet; then
            echo "No hi ha dades noves per desar"
          else
            git commit -m "Dades FEB $(date -u +%Y-%m-%d)"
            # si mentrestant s'ha pujat un altre canvi, l'incorporem abans de pujar
            git pull --rebase --autostash || true
            git push
          fi
